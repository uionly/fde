id: ai-agent-design
slug: ai-agent-design
title: AI Agent Design
description: Bound a Northstar support agent with safe tools, approvals, and recovery.
scenario: Northstar wants an agent that searches policy, reads account data,
  creates tickets, and can propose refunds.
goals:
  - Select the minimum useful tools and permissions
  - Design approval, termination, and recovery behavior
difficulty: advanced
estimatedMinutes: 70
skills:
  - AI Engineering
  - Security
  - Production
steps:
  - id: task-boundary
    title: Define the agent boundary
    type: text
    instruction: State which decisions need dynamic planning and which remain deterministic.
    hint: Do not make a workflow agentic merely because an LLM is available.
    solution: Use the agent for intent and tool choice; keep identity, thresholds,
      authorization, and writes deterministic.
    validation:
      minCharacters: 80
      criteria:
        - State which decisions need dynamic planning and which remain
          deterministic.
        - Explain the customer consequence, name the responsible owner, and
          describe a positive and a negative verification case.
      check:
        prompt: Which control must remain outside model discretion?
        choices:
          - id: unsafe
            text: The phrasing of a read-only explanation
            rationale: The model can propose actions, but trusted code must enforce identity
              and policy.
          - id: bounded
            text: Authorization and consequential-write policy enforcement
            rationale: This satisfies the authored check; the written deliverable still
              needs human review.
        correct: bounded
  - id: tool-contracts
    title: Design tool contracts
    type: code
    instruction: Describe narrow schemas and permissions for search, account lookup,
      and ticket creation.
    hint: Prefer task-specific tools over generic database or HTTP access.
    solution: Each typed tool validates input, uses caller identity, returns bounded
      data, and records an audit event.
    validation:
      minCharacters: 80
      criteria:
        - Describe narrow schemas and permissions for search, account lookup,
          and ticket creation.
        - Explain the customer consequence, name the responsible owner, and
          describe a positive and a negative verification case.
      check:
        prompt: How should a ticket-creation tool handle an unknown timeout outcome?
        choices:
          - id: bounded
            text: Reconcile using a stable operation ID before repeating the write
            rationale: This satisfies the authored check; the written deliverable still
              needs human review.
          - id: unsafe
            text: Retry with a new operation ID until a response arrives
            rationale: A new operation ID can create duplicate tickets after the original
              write already succeeded.
        correct: bounded
  - id: approval-policy
    title: Add human approval
    type: architecture
    instruction: Define which actions pause for approval and what the reviewer sees.
    hint: Consider financial value, irreversibility, and confidence.
    solution: Refunds and external messages require approval with rationale,
      evidence, amount, target, and proposed arguments.
    validation:
      minCharacters: 80
      criteria:
        - Define which actions pause for approval and what the reviewer sees.
        - Explain the customer consequence, name the responsible owner, and
          describe a positive and a negative verification case.
      check:
        prompt: What makes approval valid for a consequential action?
        choices:
          - id: unsafe
            text: Treat one approval as permission for any later action
            rationale: Approval of one proposal cannot authorize changed arguments or future
              actions.
          - id: bounded
            text: Bind approval to the exact target and arguments, then recheck
              authorization at execution
            rationale: This satisfies the authored check; the written deliverable still
              needs human review.
        correct: bounded
  - id: recovery
    title: Plan termination and recovery
    type: text
    instruction: Define retry limits, fallback, escalation, and user-visible failure
      behavior.
    hint: Every agent loop needs a safe way to stop.
    solution: Classify retryable errors, cap attempts, prevent duplicate writes,
      preserve state, and hand off with context.
    validation:
      minCharacters: 80
      criteria:
        - Define retry limits, fallback, escalation, and user-visible failure
          behavior.
        - Explain the customer consequence, name the responsible owner, and
          describe a positive and a negative verification case.
      check:
        prompt: What should happen when the agent exhausts its retry budget?
        choices:
          - id: bounded
            text: Stop safely and hand off the attempted actions, evidence, and unknown
              outcomes
            rationale: This satisfies the authored check; the written deliverable still
              needs human review.
          - id: unsafe
            text: Keep retrying until the customer closes the browser
            rationale: A bounded handoff prevents runaway cost and duplicate effects while
              preserving recovery context.
        correct: bounded
